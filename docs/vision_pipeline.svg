<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="1000" height="340" fill="#ffffff"/>
  <text x="30" y="28" font-size="20" font-weight="bold" fill="#111827">视觉处理流水线 · 端到端（E2E）数据流</text>

  <!-- Row 1 -->
  <g>
    <rect x="30" y="50" width="120" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="90" y="82" text-anchor="middle" font-size="13" fill="#1e3a8a" font-weight="bold">USB 摄像头</text>
    <text x="90" y="102" text-anchor="middle" font-size="11" fill="#1e3a8a">MJPEG 640x480</text>
    <text x="90" y="116" text-anchor="middle" font-size="11" fill="#1e3a8a">@90 FPS</text>
  </g>
  <g>
    <rect x="180" y="50" width="120" height="70" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="240" y="78" text-anchor="middle" font-size="13" fill="#312e81" font-weight="bold">GStreamer 采集</text>
    <text x="240" y="96" text-anchor="middle" font-size="11" fill="#312e81">v4l2src→jpegdec</text>
    <text x="240" y="110" text-anchor="middle" font-size="11" fill="#312e81">drop · max-buffers=1</text>
  </g>
  <g>
    <rect x="330" y="50" width="120" height="70" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="390" y="82" text-anchor="middle" font-size="13" fill="#4c1d95" font-weight="bold">Letterbox</text>
    <text x="390" y="102" text-anchor="middle" font-size="11" fill="#4c1d95">640x640 等比缩放</text>
    <text x="390" y="116" text-anchor="middle" font-size="11" fill="#4c1d95">上下补黑边</text>
  </g>
  <g>
    <rect x="480" y="50" width="120" height="70" rx="10" fill="#fae8ff" stroke="#d946ef" stroke-width="1.5"/>
    <text x="540" y="82" text-anchor="middle" font-size="13" fill="#701a75" font-weight="bold">BGR→RGB</text>
    <text x="540" y="102" text-anchor="middle" font-size="11" fill="#701a75">uint8 NHWC</text>
    <text x="540" y="116" text-anchor="middle" font-size="11" fill="#701a75">归一化由 RKNN 完成</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="480" y="200" width="120" height="70" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="540" y="228" text-anchor="middle" font-size="13" fill="#14532d" font-weight="bold">RKNN INT8</text>
    <text x="540" y="246" text-anchor="middle" font-size="11" fill="#14532d">3× NPU 核并行</text>
    <text x="540" y="260" text-anchor="middle" font-size="11" fill="#14532d">RK3588 · 100+ FPS</text>
  </g>
  <g>
    <rect x="330" y="200" width="120" height="70" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
    <text x="390" y="228" text-anchor="middle" font-size="13" fill="#713f12" font-weight="bold">合并输出</text>
    <text x="390" y="246" text-anchor="middle" font-size="11" fill="#713f12">boxes + scores</text>
    <text x="390" y="260" text-anchor="middle" font-size="11" fill="#713f12">[1,5,5376]</text>
  </g>
  <g>
    <rect x="180" y="200" width="120" height="70" rx="10" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
    <text x="240" y="228" text-anchor="middle" font-size="13" fill="#7c2d12" font-weight="bold">过滤 + NMS</text>
    <text x="240" y="246" text-anchor="middle" font-size="11" fill="#7c2d12">CONF 0.5</text>
    <text x="240" y="260" text-anchor="middle" font-size="11" fill="#7c2d12">NMS 0.45</text>
  </g>
  <g>
    <rect x="30" y="200" width="120" height="70" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="90" y="228" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="bold">画框 + 图传</text>
    <text x="90" y="246" text-anchor="middle" font-size="11" fill="#7f1d1d">标注 + 性能面板</text>
    <text x="90" y="260" text-anchor="middle" font-size="11" fill="#7f1d1d">浏览器 MJPEG</text>
  </g>

  <!-- Arrows row1 -->
  <path d="M150 85 H180" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M300 85 H330" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M450 85 H480" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Vertical connector 4->5 -->
  <path d="M540 120 V200" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Arrows row2 -->
  <path d="M480 235 H450" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M330 235 H300" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M180 235 H150" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="30" y="330" font-size="12" fill="#6b7280">E2E 实测：约 82 FPS · 端到端延迟约 31.5 ms（摄像头采集 → 排队 → letterbox → RGB → NPU 推理 → NMS → 绘框 → 显示）</text>
</svg>
